<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // GitHub Pages SPA redirect trick
    // Saves the current path and redirects to index.html
    var path = window.location.pathname;
    var query = window.location.search;
    var hash = window.location.hash;
    sessionStorage.setItem('redirect', path + query + hash);
    window.location.replace('/vestly/');
  </script>
</head>
<body></body>
</html>
